<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M10.91 2.75 A6 6 0 1 0 13.25 5.09' fill='none' stroke='%238c887e' stroke-width='1.5' stroke-linecap='round'/%3E%3Ccircle cx='12.24' cy='3.76' r='2' fill='%232f746e'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Loop Studio</title>
    <!-- PWA install metadata (docs/pwa.md §P1). The manifest link + service
         worker are injected only in the Production / PWA-test build (§P9 D8a);
         these tags are harmless everywhere. -->
    <!-- the workbench --bg-app per scheme; an explicit Light / Dark choice
         rewrites both (src/theme/theme.ts syncThemeColor, themeBoot.js) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e3e6ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101215" />
    <!-- the page ground before the stylesheet arrives (index.css --bg-app and
         color-scheme): by the system scheme, or by an explicit choice the head
         boot script set as data-theme. It reads nothing stored, so the storage
         gate keeps the system theme (issue #297) and is never painted light in
         a dark system. -->
    <style>
      :root { color-scheme: light dark; background: #e3e6ea; }
      @media (prefers-color-scheme: dark) { :root { background: #101215; } }
      :root[data-theme='light'] { color-scheme: light; background: #e3e6ea; }
      :root[data-theme='dark'] { color-scheme: dark; background: #101215; }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Loop Studio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
