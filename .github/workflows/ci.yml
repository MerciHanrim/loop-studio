name: CI

# Verification only — no deploy. Cloudflare Pages builds and deploys `main`
# directly from its GitHub connection.

# What runs where (docs/ci-main-e2e.md, Lumi 2026-11-25):
#   - a pull request: everything;
#   - a push to `main`: `checks` always; the e2e jobs only when the
#     `e2e decision` job cannot show that the merge commit holds the exact tree
#     of a pull request head whose required checks passed — anything unknown
#     runs them in full;
#   - by hand (Actions ▸ CI ▸ Run workflow) when a full check of `main` is
#     wanted, before a release among others: everything, on `main`, since the
#     same tree can still fail with time or environment. There is no scheduled
#     run any more (Hanrim / Lumi, 2026-11-27: the 03:00 KST daily run started
#     hours late and is replaced by running it by hand when needed).
#
# The actions run on Node 24, their own runtime (the app's Node is `.nvmrc`):
# `actions/checkout`, `actions/setup-node` and `actions/upload-artifact` at v7
# (2026-11-27; at v4 they targeted Node 20, which runners now force onto
# Node 24 with a deprecation warning on every job).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request: a new push cancels the running CI for that pull request.
# `main`: every commit gets its own group, keyed by its SHA, and is never
# cancelled (#424). With one group for `main`, a merge landing while the
# previous commit's run was still going cancelled that run and left the commit
# with no CI record (main `7b77c1ac`, 2026-10-29); and since a group holds only
# one pending run, scoping just `cancel-in-progress` to pull requests would
# still let a third quick merge cancel the second one while it waited. The
# manual run is keyed by its event too, so it never queues behind, or ahead of,
# the push run of the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # the change-declaration check compares with the base commit, so the
          # history has to be here: a shallow clone has no common ancestor
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: PWA icon check
        run: npm run check:icons
      - name: Mobile breakpoint — single source of truth
        run: npm run check:mobile-query
      - name: i18n catalogs — registry-wide key + ICU integrity
        run: npm run check:i18n
      - name: i18n surface — no untranslated user-facing string in a component
        run: npm run check:i18n-surface
      - name: Template label overlay — no missing / stale / duplicate dictionary id
        run: npm run check:template-labels
      - name: Visual snapshot policy — every baseline under exactly one tolerance, every shot through snap()
        run: npm run check:snapshot-policy
      - name: CSV download boundary — only src/ui/download.ts may write a CSV
        run: npm run check:csv-boundary
      - name: Form direction — every text-carrying control declares a direction
        run: npm run check:form-direction
      - name: Caller-supplied direction — required, no default, passed by every caller
        run: npm run check:direction-props
      - name: Content direction — every ruled element still declares the direction its content decides
        run: npm run check:content-direction
      - name: Arrow direction — every arrow decided by its meaning unit, no mirroring transforms
        run: npm run check:arrow-direction
      - name: Functional glyphs — no replaced glyph returns to a component or a translation catalog
        run: npm run check:functional-glyphs
      - name: Model-semantics version — a capability check, never an equality, so a later document is never read as v1
        run: npm run check:model-version
      - name: Check every deferred isolation obligation is implemented
        run: npm run check:isolate-arguments
      - name: ICU arguments — every interpolated value classified, nothing unexamined
        run: npm run check:icu-arguments
      - name: Locale lists — no enumeration knows about some shipped locales and not the rest
        run: npm run check:locale-lists
      - name: Control bytes — no tracked text file carries a raw control byte
        run: npm run check:control-bytes
      - name: Storage port — browser storage is reached through one module only
        run: npm run check:storage-port
      - name: Share crypto — key handling and encryption stay in one module, with fixed parameters
        run: npm run check:share-crypto
      - name: Licence screen — the third-party notices are shown as text, never through an HTML sink
        run: npm run check:licence-screen
      - name: Change declaration — a change that ships says whether it is user-facing, with its version and release note
        # a change only: the manual run declares nothing
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: npm run check:change-declaration
        env:
          # a pull request: its HEAD commit against the base BRANCH as fetched
          # (fetch-depth 0), so the base is merge-base(main, head) at run time —
          # not `base.sha`, which lags behind main and made the checked-out MERGE
          # commit carry another PR's declaration into this one's count (#415);
          # a push to main: the working tree against the commit before it
          CHANGE_BASE: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || github.event.before }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
      - name: E2E shards — every listed test in exactly one shard, every shard within the time budget
        run: npm run check:e2e-shards
      - name: Web build
        run: npm run build
      - name: Portable build
        run: npm run build:portable
      - name: No PWA leakage in plain / portable builds
        run: npm run check:no-pwa
      - name: PWA build (mode=pwa)
        run: npm run build:pwa
      - name: PWA precache closure (mode=pwa)
        run: npm run check:pwa-closure
      # issue #301 — the notices ship in each build, match the manifest, and the
      # PWA precaches them; the build itself already failed on a manifest mismatch
      - name: Third-party notices in the web, portable and PWA builds
        run: npm run check:third-party-notices
      - name: PWA precache closure and notices (Cloudflare Production path)
        run: CF_PAGES_BRANCH=main npm run build && node scripts/check-pwa-closure.mjs dist && node scripts/check-third-party-notices.mjs dist pwa

  # ── Whether this run needs the e2e jobs ────────────────────────────────
  # `scripts/ci-main-e2e-decision.mjs` (its rules are in its header and in
  # docs/ci-main-e2e.md). Only a push to `main` can come out `false`; a pull
  # request and the manual run answer `true` without looking
  # anything up. The e2e jobs below run unless the answer is exactly `false`,
  # so this job failing or giving no answer runs them in full.
  e2e-decision:
    name: e2e decision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      run_e2e: ${{ steps.decide.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          # a push compares the merge commit with its parent and the head's tree,
          # so it needs the history; anything else answers without git. The
          # values are STRINGS: in an expression the number 0 is falsy, so
          # `&& 0 || 1` gave 1 on a push too (main c35455d6: a depth-1 clone, no
          # parent, every e2e job run), while the string '0' is truthy.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: decide
        run: node scripts/ci-main-e2e-decision.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before }}

  # ── E2E, parallelised ──────────────────────────────────────────────────
  # The dev-server + portable suite (`npm run e2e`) is split into N shards that
  # run concurrently; the production-bundle and PWA suites are their own jobs.
  # The `e2e` job below fans them back into one status.
  #
  # The split is by PREDICTED TIME (issue #311): `scripts/e2e-shards.mjs` reads
  # the live test list and `e2e/shard-weights.json` (measured seconds per spec
  # file, one sample per CI run) and places the files longest-first into the
  # least-loaded shard. Playwright's own `--shard` splits by test count, and
  # that left one shard at 18 min 44 s against the 20-minute limit. The `checks`
  # job proves every listed test is in exactly one shard and that every shard is
  # within the budget (`npm run check:e2e-shards`). To change the shard count,
  # change the matrix AND the `/N` in the run step; the check keeps them equal.
  e2e-shard:
    name: e2e (shard ${{ matrix.shard }}/8)
    needs: e2e-decision
    if: ${{ !cancelled() && needs.e2e-decision.outputs.run_e2e != 'false' }}
    # Windows so the committed visual baselines (`*-win32.png`) match; public
    # repo ⇒ Actions minutes are free.
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      # the default config's `build-portable` setup project self-builds the
      # portable bundle on the one shard that carries the portable spec
      - name: E2E (dev server + portable file://)
        run: node scripts/e2e-shards.mjs run ${{ matrix.shard }}/8
      # the JSON report is the timing sample `scripts/e2e-shard-weights.mjs`
      # reads to refresh the weights; small, kept for two weeks, uploaded always
      - name: Upload the timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: test-results/e2e-report.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-dist:
    name: e2e (production bundle)
    needs: e2e-decision
    if: ${{ !cancelled() && needs.e2e-decision.outputs.run_e2e != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: E2E (production bundle)
        run: npm run e2e:dist
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-dist
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-pwa:
    name: e2e (PWA)
    needs: e2e-decision
    if: ${{ !cancelled() && needs.e2e-decision.outputs.run_e2e != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: E2E (PWA — service worker, offline, update)
        run: npm run e2e:pwa
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-pwa
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # single stable status that gates the branch — green only if every E2E job
  # is, or, on a push to `main` only, if the decision job itself succeeded and
  # answered exactly `false` (the e2e jobs then show as skipped)
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [e2e-decision, e2e-shard, e2e-dist, e2e-pwa]
    if: always()
    steps:
      - name: Every E2E job passed, or this push holds an already verified tree
        run: |
          echo "event    : ${{ github.event_name }}"
          echo "decision : ${{ needs.e2e-decision.result }} run_e2e=${{ needs.e2e-decision.outputs.run_e2e }}"
          echo "shards   : ${{ needs.e2e-shard.result }}"
          echo "dist     : ${{ needs.e2e-dist.result }}"
          echo "pwa      : ${{ needs.e2e-pwa.result }}"
          if test "${{ github.event_name }}" = "push" \
            && test "${{ needs.e2e-decision.result }}" = "success" \
            && test "${{ needs.e2e-decision.outputs.run_e2e }}" = "false"; then
            echo "e2e skipped: the merge commit holds a verified pull request head's tree (see the e2e decision job)"
            exit 0
          fi
          test "${{ needs.e2e-shard.result }}" = "success" \
            && test "${{ needs.e2e-dist.result }}" = "success" \
            && test "${{ needs.e2e-pwa.result }}" = "success"
