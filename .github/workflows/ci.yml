name: CI

# Verification only — no deploy. Cloudflare Pages builds and deploys `main`
# directly from its GitHub connection.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: PWA icon check
        run: npm run check:icons
      - name: Web build
        run: npm run build
      - name: Portable build
        run: npm run build:portable
      - name: No PWA leakage in plain / portable builds
        run: npm run check:no-pwa
      - name: PWA build (mode=pwa)
        run: npm run build:pwa
      - name: PWA precache closure (mode=pwa)
        run: npm run check:pwa-closure
      - name: PWA precache closure (Cloudflare Production path)
        run: CF_PAGES_BRANCH=main npm run build && node scripts/check-pwa-closure.mjs dist

  e2e:
    name: e2e
    # Windows so the committed visual baselines (`*-chromium-win32.png`) match;
    # public repo ⇒ Actions minutes are free.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      # `npm run e2e` self-builds the portable bundle (build-portable setup
      # project); `npm run e2e:dist` self-builds dist/ via its webServer.
      - name: E2E (dev server + portable file://)
        run: npm run e2e
      - name: E2E (production bundle)
        run: npm run e2e:dist
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
