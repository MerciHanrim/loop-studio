name: CI

# Verification only — no deploy. Cloudflare Pages builds and deploys `main`
# directly from its GitHub connection.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# a new commit on the same ref cancels the running CI for that ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # the change-declaration check compares with the base commit, so the
          # history has to be here: a shallow clone has no common ancestor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: PWA icon check
        run: npm run check:icons
      - name: Mobile breakpoint — single source of truth
        run: npm run check:mobile-query
      - name: i18n catalogs — registry-wide key + ICU integrity
        run: npm run check:i18n
      - name: i18n surface — no untranslated user-facing string in a component
        run: npm run check:i18n-surface
      - name: Template label overlay — no missing / stale / duplicate dictionary id
        run: npm run check:template-labels
      - name: Visual snapshot policy — every baseline under exactly one tolerance, every shot through snap()
        run: npm run check:snapshot-policy
      - name: CSV download boundary — only src/ui/download.ts may write a CSV
        run: npm run check:csv-boundary
      - name: Form direction — every text-carrying control declares a direction
        run: npm run check:form-direction
      - name: Caller-supplied direction — required, no default, passed by every caller
        run: npm run check:direction-props
      - name: Content direction — every ruled element still declares the direction its content decides
        run: npm run check:content-direction
      - name: Arrow direction — every arrow decided by its meaning unit, no mirroring transforms
        run: npm run check:arrow-direction
      - name: Functional glyphs — no replaced glyph returns to a component or a translation catalog
        run: npm run check:functional-glyphs
      - name: Check every deferred isolation obligation is implemented
        run: npm run check:isolate-arguments
      - name: ICU arguments — every interpolated value classified, nothing unexamined
        run: npm run check:icu-arguments
      - name: Locale lists — no enumeration knows about some shipped locales and not the rest
        run: npm run check:locale-lists
      - name: Control bytes — no tracked text file carries a raw control byte
        run: npm run check:control-bytes
      - name: Storage port — browser storage is reached through one module only
        run: npm run check:storage-port
      - name: Share crypto — key handling and encryption stay in one module, with fixed parameters
        run: npm run check:share-crypto
      - name: Licence screen — the third-party notices are shown as text, never through an HTML sink
        run: npm run check:licence-screen
      - name: Change declaration — a change that ships says whether it is user-facing, with its version and release note
        run: npm run check:change-declaration
        env:
          # a pull request is compared with its base; a push to main with the commit before it
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: E2E shards — every listed test in exactly one shard, every shard within the time budget
        run: npm run check:e2e-shards
      - name: Web build
        run: npm run build
      - name: Portable build
        run: npm run build:portable
      - name: No PWA leakage in plain / portable builds
        run: npm run check:no-pwa
      - name: PWA build (mode=pwa)
        run: npm run build:pwa
      - name: PWA precache closure (mode=pwa)
        run: npm run check:pwa-closure
      # issue #301 — the notices ship in each build, match the manifest, and the
      # PWA precaches them; the build itself already failed on a manifest mismatch
      - name: Third-party notices in the web, portable and PWA builds
        run: npm run check:third-party-notices
      - name: PWA precache closure and notices (Cloudflare Production path)
        run: CF_PAGES_BRANCH=main npm run build && node scripts/check-pwa-closure.mjs dist && node scripts/check-third-party-notices.mjs dist pwa

  # ── E2E, parallelised ──────────────────────────────────────────────────
  # The dev-server + portable suite (`npm run e2e`) is split into N shards that
  # run concurrently; the production-bundle and PWA suites are their own jobs.
  # The `e2e` job below fans them back into one status.
  #
  # The split is by PREDICTED TIME (issue #311): `scripts/e2e-shards.mjs` reads
  # the live test list and `e2e/shard-weights.json` (measured seconds per spec
  # file, one sample per CI run) and places the files longest-first into the
  # least-loaded shard. Playwright's own `--shard` splits by test count, and
  # that left one shard at 18 min 44 s against the 20-minute limit. The `checks`
  # job proves every listed test is in exactly one shard and that every shard is
  # within the budget (`npm run check:e2e-shards`). To change the shard count,
  # change the matrix AND the `/N` in the run step; the check keeps them equal.
  e2e-shard:
    name: e2e (shard ${{ matrix.shard }}/5)
    # Windows so the committed visual baselines (`*-win32.png`) match; public
    # repo ⇒ Actions minutes are free.
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      # the default config's `build-portable` setup project self-builds the
      # portable bundle on the one shard that carries the portable spec
      - name: E2E (dev server + portable file://)
        run: node scripts/e2e-shards.mjs run ${{ matrix.shard }}/5
      # the JSON report is the timing sample `scripts/e2e-shard-weights.mjs`
      # reads to refresh the weights; small, kept for two weeks, uploaded always
      - name: Upload the timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: test-results/e2e-report.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-dist:
    name: e2e (production bundle)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: E2E (production bundle)
        run: npm run e2e:dist
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dist
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-pwa:
    name: e2e (PWA)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: E2E (PWA — service worker, offline, update)
        run: npm run e2e:pwa
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pwa
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # single stable status that gates the branch — green only if every E2E job is
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [e2e-shard, e2e-dist, e2e-pwa]
    if: always()
    steps:
      - name: Every E2E job passed
        run: |
          echo "shards : ${{ needs.e2e-shard.result }}"
          echo "dist   : ${{ needs.e2e-dist.result }}"
          echo "pwa    : ${{ needs.e2e-pwa.result }}"
          test "${{ needs.e2e-shard.result }}" = "success" \
            && test "${{ needs.e2e-dist.result }}" = "success" \
            && test "${{ needs.e2e-pwa.result }}" = "success"
